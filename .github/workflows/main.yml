name: Build Android APK with Persistent Signing

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:  
      - name: Checkout Source Code  
        uses: actions/checkout@v4  

      - name: Unzip Project Files If Present  
        run: |  
          # استخراج ملفات المشروع تلقائياً
          if ls *.zip 1> /dev/null 2>&1; then  
            mkdir -p temp_unzip  
            unzip -o *.zip -d temp_unzip 2>/dev/null || true  
            TARGET_DIR=$(find temp_unzip -name "package.json" -exec dirname {} \; | head -n 1)  
            if [ -n "$TARGET_DIR" ]; then  
              echo "✅ تم العثور على ملفات المشروع في: $TARGET_DIR"  
              cp -r $TARGET_DIR/* .  
            fi  
            rm -rf temp_unzip  
          fi  

          # التأكد من وجود package.json
          if [ ! -f "package.json" ]; then
            TARGET_DIR=$(find . -maxdepth 3 -name "package.json" -exec dirname {} \; | head -n 1)
            if [ -n "$TARGET_DIR" ] && [ "$TARGET_DIR" != "." ]; then
              echo "✅ تم العثور على package.json في مجلد فرعي: $TARGET_DIR"
              cp -r $TARGET_DIR/* .
            fi
          fi

      - name: Clean Conflicting Configurations  
        run: |  
          rm -rf node_modules package-lock.json dist android  
          find . -name "capacitor.config.ts" -delete  
          find . -name "capacitor.config.json" -delete  

      - name: Set up Node.js  
        uses: actions/setup-node@v4  
        with:  
          node-version: '22'  

      - name: Install Dependencies  
        run: |  
          npm install --force  

      - name: Build Web Application  
        run: npm run build  

      - name: Install Native Capacitor Plugins  
        run: |  
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest @capacitor/filesystem@latest @capacitor/share@latest  

      - name: Initialize Capacitor Android  
        run: |  
          npx cap init "دفتر الديون" "com.daftar.aldeyon" --web-dir=dist  
          npx cap add android  
          npx cap sync android  

      - name: Set up JDK 21  
        uses: actions/setup-java@v4  
        with:  
          distribution: 'zulu'  
          java-version: '21'  

      - name: Build & Sign Clean Release APK  
        run: |  
          cd android  
          chmod +x gradlew  

          # التأكد من وجود مفتاح التوقيع الثابت حصراً
          if [ -f "../daftar_release.keystore" ]; then  
            cp ../daftar_release.keystore release.keystore  
            echo "✅ تم استخدام المفتاح الرسمي: daftar_release.keystore"  
          elif [ -f "../release.keystore" ]; then  
            cp ../release.keystore release.keystore  
            echo "✅ تم استخدام المفتاح الرسمي: release.keystore"  
          else  
            echo "❌ خطأ: لم يتم العثور على ملف التوقيع daftar_release.keystore في المشروع!"  
            exit 1  
          fi  

          RUN_NUM=${{ github.run_number }}  
          ./gradlew assembleRelease --no-daemon  

          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | tail -n 1)  
          DATE_STR=$(date +'%Y-%m-%d')  
          FINAL_APK_NAME="Daftar-Aldeyon-${DATE_STR}-v${RUN_NUM}.apk"  

          # المحاذاة والتوقيع النظيف
          $BUILD_TOOLS_DIR/zipalign -v -p 4 app/build/outputs/apk/release/app-release-unsigned.apk app/build/outputs/apk/release/aligned.apk  
          
          $BUILD_TOOLS_DIR/apksigner sign \
            --ks release.keystore \
            --ks-key-alias daftar_key \
            --ks-pass pass:"DaftarPass2026" \
            --key-pass pass:"DaftarPass2026" \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out "app/build/outputs/apk/release/${FINAL_APK_NAME}" \
            app/build/outputs/apk/release/aligned.apk  

          $BUILD_TOOLS_DIR/apksigner verify -v "app/build/outputs/apk/release/${FINAL_APK_NAME}"  

      - name: Upload Signed APK  
        uses: actions/upload-artifact@v4  
        with:  
          name: Daftar-Aldeyon-APK  
          path: android/app/build/outputs/apk/release/Daftar-Aldeyon-*.apk
